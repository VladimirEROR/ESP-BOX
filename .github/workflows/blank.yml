name: Build IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          ls /Applications/ | grep Xcode
          XCODE_APP=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Fix project format (safety)
        run: sed -i '' 's/objectVersion = 77/objectVersion = 56/' ESP-BOX.xcodeproj/project.pbxproj || true

      - name: Archive app (unsigned)
        run: |
          xcodebuild archive \
            -project ESP-BOX.xcodeproj \
            -scheme ESP-BOX \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/ESP-BOX.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -r "build/ESP-BOX.xcarchive/Products/Applications/ESP-BOX.app" build/Payload/
          cd build
          zip -r ESP-BOX.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ESP-BOX-IPA
          path: build/ESP-BOX.ipa
