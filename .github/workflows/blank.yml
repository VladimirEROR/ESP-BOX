name: Build IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (unsigned, iphoneos)
        run: |
          xcodebuild build \
            -project ESP-BOX.xcodeproj \
            -scheme ESP-BOX \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Verify binary exists & Package IPA
        run: |
          APP_PATH=$(find build -name "*.app" -type d | head -1)
          echo "App found at: $APP_PATH"
          ls -la "$APP_PATH"

          EXEC_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_PATH/Info.plist")
          echo "Main binary is: $EXEC_NAME"

          if [ ! -f "$APP_PATH/$EXEC_NAME" ]; then
            echo "ERROR: Main binary is missing! Aborting."
            exit 1
          fi

          echo "Binary OK — packaging IPA..."
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r ESP-BOX.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ESP-BOX-IPA
          path: ESP-BOX.ipa
