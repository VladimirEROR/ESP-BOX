name: Build ESP-BOX IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Disable line ending conversion
        run: |
          git config --global core.autocrlf false
          git config --global core.filemode false
      
      - name: Install ldid
        run: |
          brew install ldid || true
          which ldid
      
      - name: Build IPA
        run: |
          dos2unix build.sh || true
          bash build.sh
      
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ESP-BOX-IPA
          path: ESP-BOX.ipa
          retention-days: 30
