name: Build ESP-BOX IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Compile Swift
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK_PATH"
          
          swiftc \
            -target arm64-apple-ios15.0 \
            -sdk "$SDK_PATH" \
            -o ESP-BOX \
            -parse-as-library \
            -emit-executable \
            -O \
            -swift-version 5 \
            Sources/ESP_BOXApp.swift \
            Sources/ContentView.swift \
            Sources/Core/ProcessFinder.swift \
            Sources/Core/MemoryManager.swift \
            Sources/Core/MLBBOffsets.swift \
            Sources/Core/EntityParser.swift \
            Sources/Overlay/OverlayWindow.swift \
            Sources/Overlay/ESPRenderer.swift
      
      - name: Package IPA (unsigned)
        run: |
          mkdir -p ESP-BOX.app
          cp ESP-BOX ESP-BOX.app/
          cp Config/Info.plist ESP-BOX.app/
          
          mkdir Payload
          cp -r ESP-BOX.app Payload/
          zip -r ESP-BOX.ipa Payload
          rm -rf Payload
      
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ESP-BOX-IPA
          path: ESP-BOX.ipa
          retention-days: 30
